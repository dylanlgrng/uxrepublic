<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - UX Republic</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <div id="header-slot"></div>
    <main class="main">
      <section class="section">
        <div class="container">
          <div class="section-head">
            <div>
              <p class="section-kicker">Contact</p>
              <h1 class="section-title">Contact</h1>
            </div>
          </div>
          <article class="card card-featured">
            <div class="card-body">
              <span class="tag">Placeholder</span>
              <h3>Base de page prete a remplir</h3>
              <p>Cette page est structuree avec le design system global. Ajoute ici ton contenu final (texte, medias, cards, CTA).</p>
              <form class="contact-form" data-form="contact"><div class="grid form-grid"><label class="field"><span class="field-label">Nom</span><input class="field-input" type="text" required /></label><label class="field"><span class="field-label">Email</span><input class="field-input" type="email" required /></label></div><label class="field"><span class="field-label">Sujet</span><input class="field-input" type="text" required /></label><label class="field"><span class="field-label">Message</span><textarea class="field-input field-textarea" required></textarea></label><p data-status></p><button class="btn btn-primary" type="submit"><span>Envoyer</span></button></form>
            </div>
          </article>
        </div>
      </section>
    </main>
    <div id="footer-slot"></div>
    <script src="../assets/data.js"></script>
    <script src="../assets/app.js"></script>
    <script>window.UXLayout.initLayout()</script>
  </body>
</html>
